name: Build
run-name: ${{ gitea.actor }} is building
on: [push]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install Dependencies
        run: bun install
      - name: Type Check
        run: bun run type-check
      - name: Lint
        run: bun run lint
