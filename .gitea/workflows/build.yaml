name: Build
run-name: ${{ gitea.actor }} is building
on: [push]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install
      - name: Type Check
        run: bun run type-check
      - name: Lint
        run: bun run lint
