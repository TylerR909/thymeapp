# Pin for when the API exists. Not required for the Expo Go mobile MVP.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: thymeapp
      POSTGRES_PASSWORD: thymeapp
      POSTGRES_DB: thymeapp
    ports:
      - '5432:5432'
    volumes:
      - thymeapp-pg:/var/lib/postgresql/data

volumes:
  thymeapp-pg:
